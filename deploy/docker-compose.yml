# bbs-go 香港服务器生产部署文件。
#
# 使用方法：首次部署时复制到 /opt/bbs-go/docker-compose.yml，并把 deploy/caddy/
# 一并复制到 /opt/bbs-go/caddy/（详见 README「CI/CD 与自动化部署」）。
# 日常更新由 deploy/remote-deploy.sh 调用，本文件不需要随每次发布修改。
#
# 固定项目名，避免因部署目录改名导致 Docker 卷名变化、误连到一个空数据库。
name: bbs-go

x-builtin-postgresql-env: &builtin-postgresql-env
  POSTGRES_DB: ${BBSGO_DOCKER_POSTGRESQL_DATABASE:-bbsgo}
  POSTGRES_USER: ${BBSGO_DOCKER_POSTGRESQL_USER:-bbsgo}
  POSTGRES_PASSWORD: ${BBSGO_DOCKER_POSTGRESQL_PASSWORD:-bbsgo_password}

services:
  postgresql:
    image: postgres:16
    container_name: bbs-go-postgresql
    restart: unless-stopped
    environment:
      <<: *builtin-postgresql-env
      TZ: Asia/Shanghai
    volumes:
      # 命名卷，`docker compose down`（不带 -v）不会删除
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  bbs-go:
    # remote-deploy.sh 会导出 BBSGO_IMAGE；回滚时传入 sha tag 即可
    image: ${BBSGO_IMAGE:-ghcr.io/creeper-scr/bbs-vivalavita:latest}
    container_name: bbs-go
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      # 安装状态（installed: true）、idCodec 密钥、上传文件都在宿主机目录中，
      # 重建容器不会丢失，也不会重新进入安装流程。
      - ./docker-data-postgresql/data:/app/data
      - ./docker-data-postgresql/logs:/app/logs
      - ./docker-data-postgresql/uploads:/app/res/uploads
    ports:
      # 只绑定本机，公网流量走 Caddy；调试可 SSH 隧道访问 127.0.0.1:3000
      - "127.0.0.1:3000:3000"
    environment:
      BBSGO_ENV: prod
      NODE_ENV: production
      PORT: 3000
      BBSGO_SERVER_URL: http://127.0.0.1:8082
      BBSGO_INSTALL_DOCKER_BUILTIN_POSTGRESQL: "true"
      BBSGO_DOCKER_BUILTIN_POSTGRESQL_HOST: postgresql
      BBSGO_DOCKER_BUILTIN_POSTGRESQL_PORT: "5432"
      BBSGO_DOCKER_BUILTIN_POSTGRESQL_DATABASE: ${BBSGO_DOCKER_POSTGRESQL_DATABASE:-bbsgo}
      BBSGO_DOCKER_BUILTIN_POSTGRESQL_USERNAME: ${BBSGO_DOCKER_POSTGRESQL_USER:-bbsgo}
      BBSGO_DOCKER_BUILTIN_POSTGRESQL_PASSWORD: ${BBSGO_DOCKER_POSTGRESQL_PASSWORD:-bbsgo_password}
      TZ: Asia/Shanghai

  caddy:
    # 带 Brotli 模块的 Caddy，由 GitHub Actions 构建到同一个 GHCR 包
    image: ${CADDY_IMAGE:-ghcr.io/creeper-scr/bbs-vivalavita:caddy}
    container_name: bbs-go-caddy
    restart: unless-stopped
    depends_on:
      - bbs-go
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # 必填：在 /opt/bbs-go/.env 中设置，缺失时 compose 直接报错
      BBSGO_DOMAIN: ${BBSGO_DOMAIN:?set BBSGO_DOMAIN in /opt/bbs-go/.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 自动签发的证书与 ACME 账户，重建容器不会重新签发
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgresql-data:
  caddy-data:
  caddy-config:
